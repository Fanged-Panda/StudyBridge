<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — StudyBridge</title>
    <meta name="theme-color" content="#1a2b48" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #f8f9ff 0%, #e8f4f3 100%);
        color: #1a2b48;
        padding: 24px;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e5eeff;
        border-radius: 24px;
        box-shadow: 0 20px 60px -20px rgba(26, 43, 72, 0.18);
        padding: 48px 40px;
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      .logo {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        margin: 0 auto 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #26a69a 0%, #1e7e8c 55%, #1a2b48 100%);
      }
      .logo svg { width: 56px; height: 56px; }
      h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
      p { color: #64748b; line-height: 1.6; font-size: 15px; }
      .retry {
        margin-top: 28px;
        display: inline-block;
        background: #26a69a;
        color: #fff;
        font-weight: 700;
        font-size: 15px;
        padding: 12px 32px;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.2s;
      }
      .retry:hover { background: #009b9b; }
      .home { margin-top: 16px; display: block; color: #1a2b48; font-size: 14px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 512 512" fill="none">
          <path d="M112 292 Q256 128 400 292" stroke="#fff" stroke-width="34" stroke-linecap="round" fill="none"/>
          <rect x="96" y="288" width="320" height="26" rx="13" fill="#fff"/>
          <rect x="122" y="248" width="26" height="66" rx="13" fill="#fff"/>
          <rect x="364" y="248" width="26" height="66" rx="13" fill="#fff"/>
          <g fill="#fff">
            <path d="M196 192 L256 160 L316 192 L256 224 Z"/>
            <rect x="196" y="196" width="120" height="10" rx="5"/>
            <path d="M300 224 L300 274 Q300 294 256 302 Q212 294 212 274 L212 224 Z" opacity="0.55"/>
            <path d="M316 208 L316 250 Q316 262 330 262 Q344 262 344 250 L344 208 Z" opacity="0.55"/>
          </g>
        </svg>
      </div>
      <h1>You are offline</h1>
      <p>Previously cached pages remain available. Reconnect to browse universities, scholarships, and your study plan.</p>
      <button class="retry" onclick="window.location.reload()">Try again</button>
      <a class="home" href="/">Go to StudyBridge home</a>
    </div>
  </body>
</html>
